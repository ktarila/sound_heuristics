<link rel="preconnect" href="https://fonts.googleapis.com">

<meta name="description" content="Three versions of the sound intensity search looking for the lowest point of 64 test functions (CEC 2022, CEC 2017 and the classic 23), with the history of each function and what the method does well and where it is limited.">
<style>
:root {
  --bg: #ffffff; --surface: #f4f5f7; --surface2: #e8eaee; --ink: #111827; --muted: #5b6472;
  --line: #e3e6ea; --on-ink: #ffffff; --page: #ffffff; --desk: #e9ebef;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #171b22; --surface2: #232935; --ink: #e9ebef; --muted: #98a2b3;
    --line: #272d38; --on-ink: #0d1015; --page: #161a21; --desk: #0a0c10;
    --v1: #94a3b8; --v2: #60a5fa; --v3: #fb923c; --good: #4ade80; --bad: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #171b22; --surface2: #232935; --ink: #e9ebef; --muted: #98a2b3;
  --line: #272d38; --on-ink: #0d1015; --page: #161a21; --desk: #0a0c10;
  --v1: #94a3b8; --v2: #60a5fa; --v3: #fb923c; --good: #4ade80; --bad: #f87171;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--ink); text-underline-offset: 3px; }
h1 { font-size: clamp(2rem, 4.2vw, 3rem); line-height: 1.1; letter-spacing: -0.025em; margin: 6px 0 14px; font-weight: 750; }
h2 { font-size: 1.5rem; letter-spacing: -0.015em; margin: 56px 0 12px; font-weight: 700; }
h3 { font-size: 1.05rem; margin: 0 0 6px; font-weight: 650; }
p { margin: 0 0 14px; max-width: 70ch; }
ul, ol { margin: 0 0 14px; padding-left: 22px; max-width: 70ch; }

.label { font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.lede { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }

/* layout: the sidebar is fixed to the window and scrolls on its own */
.shell { min-height: 100vh; }
#side { background: var(--surface); padding: 22px 14px 28px; position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar);
  overflow-y: auto; overscroll-behavior: contain; z-index: 5; }
main { margin-left: var(--sidebar); padding: 36px clamp(16px, 4vw, 56px) 80px; max-width: calc(1240px + var(--sidebar)); outline: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -0.01em; margin: 0 8px 18px; font-size: 1.05rem; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 0.8rem; }
#side nav a { display: flex; gap: 10px; align-items: baseline; padding: 5px 10px; border-radius: 8px; text-decoration: none;
  color: var(--ink); font-size: 0.92rem; margin-bottom: 1px; }
#side nav a:hover { background: var(--surface2); }
#side nav a[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
#side nav a .n { min-width: 2.4em; font-variant-numeric: tabular-nums; opacity: 0.65; font-size: 0.8rem; }
#side .label { display: block; margin: 18px 10px 6px; }

#side details { margin: 4px 0; }
#side summary { cursor: pointer; padding: 7px 10px; border-radius: 8px; font-weight: 650; font-size: 0.94rem; list-style: none; display: flex; justify-content: space-between; align-items: baseline; }
#side summary::-webkit-details-marker { display: none; }
#side summary:hover { background: var(--surface2); }
#side summary .count { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
#side summary::before { content: "▸"; margin-right: 8px; color: var(--muted); }
#side details[open] > summary::before { content: "▾"; }
#side summary { justify-content: flex-start; gap: 0; }
#side summary .count { margin-left: auto; }
.getcode { margin: 0 8px 16px; display: grid; gap: 8px; }
.getcode a.btn { text-decoration: none; text-align: center; display: block; }
.getcode a.zip { font-size: 0.84rem; color: var(--muted); text-align: center; }
.topbar { display: none; }
.scrim { display: none; }

/* flat components */
.btn { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--surface2); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--ink); color: var(--on-ink); font-weight: 650; min-width: 98px; }
.btn.primary:hover { opacity: 0.88; }
select { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--surface2); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
:focus-visible { outline: 3px solid var(--v2); outline-offset: 2px; }
main:focus, main:focus-visible { outline: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0; }
.tile { background: var(--surface); border-radius: 12px; padding: 16px 18px; }
.tile .big { font-size: 1.75rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .small { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
.card { background: var(--surface); border-radius: 12px; padding: 20px 22px; }
.card.link { display: block; text-decoration: none; }
.card.link:hover { background: var(--surface2); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.crumb { color: var(--muted); font-size: 0.9rem; }
.crumb a { color: var(--muted); }
.pill { display: inline-block; font-size: 0.78rem; font-weight: 650; padding: 2px 10px; border-radius: 999px; background: var(--surface2); margin-left: 6px; vertical-align: 2px; }
.pill.solved { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; font-size: 0.74rem; color: #fff; }
.bar span { display: grid; place-items: center; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part { display: grid; grid-template-columns: 200px 1fr; gap: 4px 18px; padding: 12px 0; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; padding-top: 0; }
.part:last-child { padding-bottom: 0; }
.part .what { font-weight: 650; }
.part .share { color: var(--muted); font-size: 0.86rem; }
.part p { margin: 0 0 4px; font-size: 0.94rem; }
.part .src { color: var(--muted); font-size: 0.84rem; }

/* viewer */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.slider { flex: 1 1 260px; display: flex; gap: 12px; align-items: center; min-width: 220px; }
.slider input { flex: 1; accent-color: var(--ink); }
.evals { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 12ch; text-align: right; font-size: 0.92rem; }
.opt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.88rem; }
.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.panel { background: var(--surface); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.panel .head { padding: 14px 16px 0; }
.panel h3 { display: flex; align-items: center; gap: 8px; }
.panel .tag { color: var(--muted); font-size: 0.88rem; margin: 2px 0 6px; }
.panel ul { margin: 0 0 4px; padding-left: 18px; font-size: 0.88rem; }
.panel li { margin-bottom: 3px; }
.panel .more { font-size: 0.86rem; display: inline-block; margin: 2px 0 4px; }
.plot3d { height: 340px; margin-top: auto; }
.status { padding: 10px 16px 14px; font-size: 0.9rem; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
.chart { background: var(--surface); border-radius: 12px; padding: 14px 12px 6px; margin: 12px 0; }
.chart h3 { margin: 0 6px; }
.plot2d { height: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--muted); margin: 10px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.note { color: var(--muted); font-size: 0.9rem; }

/* tables */
.tablewrap { overflow-x: auto; border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { padding: 10px 14px; text-align: right; }
th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; }
th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
tbody tr { border-top: 1px solid var(--line); }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--surface2); }
tbody tr.head td { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; background: var(--surface2); cursor: default; }
td.num { font-variant-numeric: tabular-nums; }
table.left th, table.left td { text-align: left; }
.solved { color: var(--good); font-weight: 650; }
.better { color: var(--good); font-weight: 650; }
.worse { color: var(--bad); font-weight: 650; }
.pager { display: flex; justify-content: space-between; margin-top: 48px; gap: 12px; }
.pager a { background: var(--surface); border-radius: 12px; padding: 14px 18px; text-decoration: none; flex: 1; }
.pager a:hover { background: var(--surface2); }
.pager .next { text-align: right; }
.fail { background: var(--surface2); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }

/* tried and did not work: laid out as a research document on a page */
body.doc { background: var(--desk); }
sup.ord, sup.pow { font-size: 0.68em; line-height: 0; vertical-align: 0.5em; margin-left: 0.04em; }
.paper .katex { font-size: 1.06em; }
.paper .katex-display { margin: 0.7em 0; overflow-x: auto; overflow-y: hidden; }
/* pseudocode, ruled like the tables */
.paper .algo { border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); padding: 0 0 0.5em; font-size: 0.9em; line-height: 1.5; }
.paper .algo figcaption { font-size: 1em; padding: 0.45em 0; margin: 0 0 0.45em; border-bottom: 0.75px solid var(--ink); }
.paper .algo p { text-indent: 0; text-align: left; hyphens: none; }
.paper .algo .io { margin: 0 0 0.35em; }
.paper .algo ol { list-style: none; margin: 0; padding: 0; }
.paper .algo li { display: flex; align-items: baseline; gap: 0.5em; margin: 0; padding: 1px 0; text-align: left; hyphens: none; }
.paper .algo li.enc { background: color-mix(in srgb, var(--v2) 7%, transparent); }
.paper .algo .ln { flex: none; width: 1.7em; text-align: right; color: var(--muted); font-size: 0.85em; font-variant-numeric: tabular-nums; }
.paper .algo .mk { flex: none; width: 0.7em; color: var(--v2); font-weight: 700; }
.paper .algo .code { flex: 1 1 auto; min-width: 0; padding-left: calc(var(--d) * 1.4em); }
.paper .algo .cm { flex: 0 1 36%; color: var(--muted); font-style: italic; text-align: right; padding-right: 0.3em; }
.paper .algo .settings { border-top: 0.75px solid var(--ink); margin: 0.5em 0 0; padding-top: 0.45em; font-size: 0.95em; }
@media (max-width: 700px) {
  .paper .algo li { display: grid; grid-template-columns: 1.5em 0.7em minmax(0, 1fr); column-gap: 0.4em; }
  .paper .algo .code { padding-left: calc(var(--d) * 0.8em); }
  .paper .algo .cm { grid-column: 3; text-align: left; padding: 0 0 0.15em calc(var(--d) * 0.8em); }
}
body.doc { --pfont: "Source Serif 4", Charter, "Bitstream Charter", Georgia, "Times New Roman", serif; --sheet-shadow: 0 1px 3px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.06); }
.paper {
  background: var(--page); border: 1px solid var(--line); box-shadow: var(--sheet-shadow);
  max-width: 1080px; margin: 0 auto; padding: clamp(28px, 5vw, 72px) clamp(20px, 3.5vw, 64px); font: 17px/1.55 var(--pfont); }
.paper p, .paper ul, .paper ol, .paper li { max-width: none; }
.paper p { margin: 0; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.paper p + p { text-indent: 1.5em; }
.paper ul { margin: 0.5em 0 0.7em; padding-left: 1.6em; }
.paper li { margin: 0 0 0.3em; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.paper a { color: inherit; }
.paper sup { line-height: 0; }
.paper .ptitle { text-align: center; margin: 0 0 2.4em; }
.paper .ptitle p { text-align: center; text-indent: 0; }
.paper .kind { font-variant: small-caps; text-transform: lowercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 1em; }
.paper h1 { font: 700 clamp(1.5rem, 3vw, 2.05rem)/1.22 var(--pfont); letter-spacing: 0; margin: 0 auto 0.75em; max-width: 24em; }
.paper .byline { color: var(--muted); }
.paper h2 { font: 700 1.28rem/1.3 var(--pfont); letter-spacing: 0; margin: 2.2em 0 0.7em; }
.paper h3.sub { font: 700 1.05rem/1.35 var(--pfont); letter-spacing: 0; margin: 1.7em 0 0.5em; }
.paper .no { display: inline-block; min-width: 2.1em; }
.paper h3.sub .no { min-width: 2.6em; }
.paper [id] { scroll-margin-top: 70px; }
@media (min-width: 1360px) { .paper [id] { scroll-margin-top: 20px; } }
.paper a.xref, .paper a.cite { color: var(--v2); text-decoration: none; }
.paper a.xref:hover, .paper a.cite:hover { text-decoration: underline; }
.paper .hit { animation: hit 1.8s ease-out; }
@keyframes hit { 0%, 35% { background-color: color-mix(in srgb, var(--v2) 16%, transparent); } 100% { background-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .paper .hit { animation: none; outline: 2px solid var(--v2); outline-offset: 2px; } }
@media (max-width: 960px) { .paper [id] { scroll-margin-top: 124px; } }
.paper .abstract { margin: 0 0 2.2em; }
.paper .abstract h2 { text-align: center; font-size: 1rem; margin: 0 0 0.5em; }
.paper .abstract p { font-size: 0.94em; }
.paper .abstract .kw { margin-top: 0.8em; text-indent: 0; text-align: left; }
.paper dl.defs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.25em 1.2em; margin: 0.6em 0 0 1.5em; }
.paper dl.defs dt { font-style: italic; }
.paper dl.defs dd { margin: 0; }
.paper .when { font-style: italic; color: var(--muted); text-indent: 0; margin: 0 0 0.6em; font-size: 0.94em; text-align: left; }
.paper .when + p { text-indent: 0; }
.paper .refs { list-style: none; padding: 0; }
.paper .refs li { padding-left: 2em; text-indent: -2em; margin: 0 0 0.45em; font-size: 0.92em; text-align: left; }
.paper .refs a { overflow-wrap: anywhere; }
.paper .refs details.why { text-indent: 0; margin: 0.25em 0 0.5em; font-size: 0.95em; }
.paper .refs details.why summary { cursor: pointer; color: var(--v2); font-size: 0.92em; list-style: none; }
.paper .refs details.why summary::-webkit-details-marker { display: none; }
.paper .refs details.why summary::before { content: "▸ "; }
.paper .refs details.why[open] summary::before { content: "▾ "; }
.paper .refs details.why[open] { background: var(--surface); padding: 0.4em 0.8em 0.2em; margin-right: 0; }
.cite-pop { position: fixed; z-index: 60; width: min(480px, calc(100vw - 24px)); overflow-y: auto; overscroll-behavior: contain; background: var(--page); color: var(--ink);
  border: 1px solid var(--line); box-shadow: var(--sheet-shadow), 0 10px 28px rgba(0,0,0,.14); padding: 12px 16px 10px; font: 0.86rem/1.45 var(--pfont); }
.cite-pop[hidden] { display: none; }
.cite-pop .ev-ref { font-weight: 600; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ev-item { margin: 0 0 9px; }
.ev-for { font-size: 0.86em; color: var(--muted); font-variant: small-caps; text-transform: lowercase; letter-spacing: 0.03em; }
.ev-q { margin: 2px 0 2px; padding: 1px 0 1px 10px; border-left: 2px solid var(--v2); }
pre.ev-q.code { font: 0.78em/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); padding: 6px 8px; border-left: 2px solid var(--v2); }
.ev-src { font-size: 0.82em; color: var(--muted); font-style: italic; }
.ev-note { font-size: 0.86em; margin: 4px 0 6px; text-indent: 0; text-align: left; }
.paper .ev-note, .paper .ev-check, .cite-pop .ev-note, .cite-pop .ev-check { text-indent: 0; }
.ev-check { font-size: 0.8em; color: var(--muted); margin: 6px 0 2px; text-indent: 0; text-align: left; border-top: 1px dashed var(--line); padding-top: 5px; }
.after-doc { margin: 18px 0 0; text-align: right; }
/* contents panel: a sheet like the paper; a sticky column beside it on wide screens, a sticky bar above it otherwise */
body.doc main { padding-left: 24px; padding-right: 24px; }
.doc-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.doc-wrap > * { min-width: 0; }
.doc-wrap > .paper { width: 100%; }
.doc-toc { position: sticky; top: 12px; z-index: 8; background: var(--page); border: 1px solid var(--line); box-shadow: var(--sheet-shadow);
  font: 0.94rem/1.4 var(--pfont); }
.toc-head { display: none; }
.toc-toggle { display: flex; width: 100%; gap: 12px; align-items: baseline; font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0;
  padding: 12px 18px; cursor: pointer; text-align: left; }
.toc-toggle::after { content: "▾"; margin-left: auto; color: var(--muted); font-weight: 400; }
.doc-toc.open .toc-toggle::after { content: "▴"; }
.toc-toggle .now { font-weight: 400; font-style: italic; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.toc-list { display: none; border-top: 1px solid var(--line); padding: 10px 10px 16px; max-height: min(70vh, 640px); overflow-y: auto; overscroll-behavior: contain; }

.toc-list a .n { min-width: 1.6em; flex: none; font-variant-numeric: tabular-nums; color: var(--muted); }
.toc-list a:not(.l2) { font-weight: 600; margin-top: 8px; }
.toc-list a:first-child { margin-top: 0; }
.toc-list a.l2 { padding-left: 20px; color: var(--muted); font-size: 0.93em; }
.toc-list a.l2 .n { min-width: 2.3em; }
.toc-list a:hover { color: var(--ink); background: var(--surface); }
.toc-list a[aria-current="location"] { color: var(--ink); border-left-color: var(--v2); background: color-mix(in srgb, var(--v2) 9%, transparent); }
@media (min-width: 1360px) {
  .doc-wrap { grid-template-columns: minmax(0, 1fr) clamp(290px, 21vw, 340px); gap: 24px; }

}
@media (max-width: 960px) { .doc-toc { top: 64px; } body.doc main { padding-left: 16px; padding-right: 16px; } }
/* tables with three rules, as in printed papers */

.paper .filter button { font: inherit; background: none; border: 0; padding: 0 3px; color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

@container (max-width: 540px) {

  table.entries td.txt::before { content: attr(data-label); font-variant: small-caps; text-transform: lowercase; letter-spacing: 0.06em; color: var(--muted); }
}

@media (max-width: 600px) { .paper { font-size: 16px; } .paper p, .paper li, .paper .rfig figcaption { text-align: left; } .paper dl.defs { grid-template-columns: minmax(0, 1fr); margin-left: 0; } .paper dl.defs dd { margin-bottom: 0.4em; } }

@media (max-width: 960px) {

<body>
<div class="topbar">
  <button class="btn" id="menu" type="button" aria-expanded="false" aria-controls="side">☰ Menu</button>
  <div class="brand"><span class="mark">♪</span> Sound Intensity Search</div>
</div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside id="side" aria-label="Site">
    <div class="brand"><span class="mark">♪</span> Sound intensity search</div>
    <div class="getcode">
      <a class="btn primary" href="https://github.com/ktarila/sound_heuristics" target="_blank" rel="noopener">Code on GitHub ↗</a>
      <a class="zip" href="https://github.com/ktarila/sound_heuristics/archive/refs/heads/master.zip">Download Encore (ZIP)</a>
    </div>
    <nav id="nav" aria-label="Pages"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="meta.js"></script>
<script src="tables.js"></script>
<script src="functions.js"></script>
<script src="tried.js"></script>
<script>
(function () {
  "use strict";
  var T = window.SOUND_TEXT, META = window.SOUND_META, TABLE = window.SOUND_TABLE;
  var SUITES = ["cec2022", "cec2017", "classic"];
  var VERS = T.versions.map(function (v) { v.color = "--v" + v.id; return v; });
  var state = {suite: "cec2022", f: 1, run: 0, frame: 0, frames: 60, playing: false, scale: "log", timer: null, speed: 12, data: null};
  var cameraEye = {x: 1.3, y: -1.35, z: 0.9};
  var syncing = false, token = 0;

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function h(z) { return state.scale === "log" ? z : Math.pow(10, z) - 1; }
  function fmt(x) {
    if (x === 0) return "0";
    var a = Math.abs(x);
    if (a < 1e-3 || a >= 1e5) return x.toExponential(2).replace("e+", "e").replace("e-0", "e-");
    return a >= 100 ? x.toFixed(0) : a >= 10 ? x.toFixed(1) : a >= 1 ? x.toFixed(2) : x.toPrecision(2);
  }
  function fmtN(n) { return n.toLocaleString("en-US"); }
  function num(v) { return String(v).replace("-", "−"); }
  function theme() { return {fg: css("--ink"), muted: css("--muted"), grid: css("--line"), surface: css("--surface")}; }
  function runOf(v) { return state.data.runs[String(v)][state.run]; }
  function verdictWord(v) { return v === "+" ? "better" : v === "-" ? "worse" : "no different"; }
  function verdictHtml(v, short) { return '<span class="' + (v === "+" ? "better" : v === "-" ? "worse" : "muted") + '">' + (short && v === "=" ? "same" : verdictWord(v)) + '</span>'; }

  // one function: its name, group, building blocks and text, whichever group it is in
  function ids(suite) {
    var source = suite === "cec2022" ? T.functions.cec2022 : META[suite];
    return Object.keys(source).map(Number);
  }
  function info(suite, i) {
    var t = (T.functions[suite] || {})[i] || {};
    if (suite === "cec2022") return t;
    var m = META[suite][i], out = {};
    Object.keys(m).forEach(function (k) { out[k] = m[k]; });
    Object.keys(t).forEach(function (k) { out[k] = t[k]; });
    return out;
  }
  function funcLabel(suite, i) { return suite === "classic" ? "f" + i : "F" + i; }
  function rangeText(m) {
    var same = m.lower.every(function (v) { return v === m.lower[0]; }) && m.upper.every(function (v) { return v === m.upper[0]; });
    if (same) return num(m.lower[0]) + " to " + num(m.upper[0]);
    return num(m.lower[0]) + " to " + num(m.upper[0]) + " and " + num(m.lower[1]) + " to " + num(m.upper[1]);
  }
  function stop() {
    state.playing = false;
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    var b = $("play"); if (b) b.textContent = state.frame >= state.frames ? "↻ Replay" : "▶ Play";
  }
  function purge() {
    ["p1", "p2", "p3", "conv2", "conv10"].forEach(function (id) {
      var el = $(id); if (el && window.Plotly) { try { Plotly.purge(el); } catch (e) { /* none */ } }
    });
  }

  // ---------- navigation ----------
  function buildNav() {
    var html = '<a href="#/tried" data-r="tried"><span>Research report</span></a>' +
      '<a href="#/overview" data-r="overview"><span>Overview</span></a>' +
      '<a href="#/versions" data-r="versions"><span>The three versions</span></a>' +
      '<a href="#/limits" data-r="limits"><span>Strengths and limits</span></a>' +
      '<span class="label">Functions</span>';
    SUITES.forEach(function (s) {
      var S = T.suites[s], all = ids(s);
      html += '<details data-s="' + s + '"><summary>' + S.label + '<span class="count">' + all.length + '</span></summary>' +
        '<a href="#/s/' + s + '" data-r="s:' + s + '"><span class="n"></span><span>All ' + all.length + ' functions</span></a>';
      S.order.forEach(function (g) {
        var members = all.filter(function (i) { return info(s, i).group === g; });
        html += '<div class="sub">' + esc(g) + '</div>';
        members.forEach(function (i) {
          html += '<a href="#/f/' + s + '/' + i + '" data-r="f:' + s + ':' + i + '"><span class="n">' + funcLabel(s, i) + '</span><span>' + esc(info(s, i).name) + '</span></a>';
        });
      });
      html += '</details>';
    });
    html += '<span class="label">More</span><a href="#/sources" data-r="sources"><span>Sources and notes</span></a>';
    $("nav").innerHTML = html;
    $("nav").addEventListener("click", function (e) {
      if (e.target.closest("a")) { document.body.classList.remove("nav-open"); $("menu").setAttribute("aria-expanded", "false"); }
    });
    // mark the section being read in the report's contents panel
    var spyQueued = false;
    window.addEventListener("scroll", function () {
      if (spyQueued || !$("doc-toc")) return;
      spyQueued = true;
      requestAnimationFrame(function () { spyQueued = false; tocSpy(); });
    }, {passive: true});
  }
  function tocSpy() {
    var toc = $("doc-toc"), current = null;
    document.querySelectorAll(".paper h2[id], .paper h3.sub[id]").forEach(function (h) {
      if (h.getBoundingClientRect().top < 120) current = h.id;
    });
    toc.querySelectorAll("a").forEach(function (a) {
      if (a.dataset.goto === current) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
    });
    // the bar on narrow screens names the current section; the list keeps that line in view
    var on = toc.querySelector('a[aria-current="location"]'), list = toc.querySelector(".toc-list");
    $("toc-now").textContent = on ? on.textContent.replace(/^([0-9.]+)/, "$1 ") : "";
    if (on && list.scrollHeight > list.clientHeight) {
      var r = on.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.top < lr.top + 8) list.scrollTop -= lr.top + 8 - r.top;
      else if (r.bottom > lr.bottom - 8) list.scrollTop += r.bottom - lr.bottom + 8;
    }
  }
  function markNav(key, suite) {
    document.querySelectorAll("#nav a").forEach(function (a) {
      if (a.dataset.r === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.querySelectorAll("#nav details").forEach(function (d) {
      if (suite) d.open = d.dataset.s === suite;
    });
    var cur = document.querySelector('#nav a[aria-current="page"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({block: "nearest"});
  }
  function parseRoute() {
    var p = location.hash.replace(/^#\/?/, "").split("/");
    if (p[0] === "f") {
      if (SUITES.indexOf(p[1]) >= 0 && ids(p[1]).indexOf(+p[2]) >= 0) return {view: "f", suite: p[1], f: +p[2], key: "f:" + p[1] + ":" + p[2]};
      if (ids("cec2022").indexOf(+p[1]) >= 0) return {view: "f", suite: "cec2022", f: +p[1], key: "f:cec2022:" + p[1]};
    }
    if (p[0] === "s" && SUITES.indexOf(p[1]) >= 0) return {view: "s", suite: p[1], key: "s:" + p[1]};
    if (["overview", "versions", "limits", "tried", "sources"].indexOf(p[0]) >= 0) return {view: p[0], key: p[0], anchor: p[1]};
    return {view: "tried", key: "tried"};
  }
  // ordinals get a raised suffix (2<sup>nd</sup>) and numbers such as 2.5e-20 are set as 2.5 × 10<sup>−20</sup>
  var ORD = /(\d)(st|nd|rd|th)\b/g, EXP = /\b(\d+(?:\.\d+)?)e([+\-−]?)(\d+)\b/g;
  function supOrdinals(root) {
    var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: function (n) {
      ORD.lastIndex = EXP.lastIndex = 0;
      return (ORD.test(n.nodeValue) || EXP.test(n.nodeValue)) && !n.parentElement.closest("script, style, code, pre, sup, svg, .katex") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
    var found = [];
    while (walk.nextNode()) found.push(walk.currentNode);
    found.forEach(function (n) {
      var box = document.createElement("span");
      box.innerHTML = esc(n.nodeValue).replace(ORD, "$1<sup class=\"ord\">$2</sup>").replace(EXP, function (m, a, sign, b) {
        return a + "\u2009×\u200910<sup class=\"pow\">" + (sign === "-" || sign === "−" ? "−" : "") + b.replace(/^0+(?=\d)/, "") + "</sup>";
      });
      n.replaceWith.apply(n, Array.prototype.slice.call(box.childNodes));
    });
  }
  function route() {
    stop(); purge(); token += 1;
    var r = parseRoute(), main = $("main");
    markNav(r.key, r.suite);
    document.body.classList.toggle("doc", r.view === "tried");
    var pop = $("cite-pop"); if (pop && r.view !== "tried") pop.remove();
    if (r.view === "f") { openFunction(r.suite, r.f); }
    else {
      main.innerHTML = r.view === "versions" ? versionsView() : r.view === "limits" ? limitsView() :
        r.view === "tried" ? triedView() :
        r.view === "sources" ? sourcesView() : r.view === "s" ? suiteView(r.suite) : overviewView();
      wireTable();
      supOrdinals(main);
      if (r.view === "tried") wireTried();
      document.title = (r.view === "s" ? T.suites[r.suite].label + " · " : r.view === "tried" ? "Improving sound intensity search · " : "") + "Sound Intensity Search";
      window.scrollTo(0, 0);
      if (r.anchor) { var el = $("v" + r.anchor); if (el) el.scrollIntoView(); }
      main.focus({preventScroll: true});
    }
  }

  // ---------- tables ----------
  function resultsTable(suite) {
    var S = T.suites[suite], rows = "", last = null, cols = suite === "classic" ? 8 : 7;
    ids(suite).forEach(function (i) {
      var m = info(suite, i), t = TABLE[suite][i];
      if (m.group !== last) { rows += '<tr class="head"><td colspan="' + cols + '">' + esc(m.group) + '</td></tr>'; last = m.group; }
      var lastCol = suite === "cec2017" ? verdictHtml(t.vs_compare, true) : t.place + " of " + t.place_of;
      rows += '<tr class="link" data-s="' + suite + '" data-f="' + i + '" tabindex="0"><td>' + funcLabel(suite, i) + '</td><td>' + esc(m.name) + '</td>' +
        (suite === "classic" ? '<td class="num">' + fmt(t.v1) + '</td>' : '') +
        '<td class="num">' + fmt(t.v2) + '</td><td class="num ' + (t.v3 === 0 ? "solved" : "") + '">' + fmt(t.v3) + '</td><td class="num">' + verdictHtml(t.vs_v2, true) + '</td>' +
        '<td class="num">' + fmt(t.compare) + ' <span class="muted">(' + esc(t.compare_label) + ')</span></td><td class="num">' + lastCol + '</td></tr>';
    });
    return '<div class="tablewrap"><table class="results"><thead><tr><th>' + S.label + '</th><th>Function</th>' +
      (suite === "classic" ? '<th>Mating Call</th>' : '') + '<th>Echo</th><th>Encore</th><th>Encore vs Echo</th><th>' + S.compareHead + '</th><th>' + S.placeHead + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function wireTable() {
    document.querySelectorAll("table.results tbody tr.link").forEach(function (tr) {
      function go() { location.hash = "#/f/" + tr.dataset.s + "/" + tr.dataset.f; }
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }

  // ---------- overview and suite pages ----------
  function overviewView() {
    return '<span class="label">Three groups of test functions</span>' +
      '<h1>Sound Intensity Search</h1>' +
      '<p class="lede">A method for finding the lowest value of a function, inspired by how peafowl use infrasound in mating displays. ' +
      'Every agent in a group makes a sound that is louder the better the agent is. Each agent listens, picks out the loudest sound it hears, ' +
      'and moves towards it if that agent is better, or away from it if not.</p>' +
      '<p class="muted">Based on Kenekayoro (2021), <em>Journal of Advances in Mathematics and Computer Science</em> 36(5). This site shows the three versions of the code, named after how they search: Mating Call, Echo and Encore.</p>' +
      '<div class="tiles">' +
      '<div class="tile"><div class="big">4th · 2nd</div><div class="small">of 13 on the CEC 2022 test set, at 10 and at 20 coordinates; no entry is significantly better</div></div>' +
      '<div class="tile"><div class="big">4 of 12</div><div class="small">CEC 2022 functions solved in every run at 10 coordinates: F1, F3, F5, F11</div></div>' +
      '<div class="tile"><div class="big">24 of 29</div><div class="small">CEC 2017 functions where Encore beats Echo at 30 coordinates; none worse</div></div>' +
      '<div class="tile"><div class="big">F4 · F8 · F10</div><div class="small">where it is limited in CEC 2022: fields of valleys and a trap</div></div></div>' +
      '<h2>Three groups of functions</h2><div class="cols3">' + SUITES.map(function (s) {
        var S = T.suites[s];
        return '<a class="card link" href="#/s/' + s + '"><span class="label">' + S.short + '</span><h3 style="margin-top:6px">' + S.title + '</h3>' +
          '<p class="muted" style="margin:0">' + esc(S.blurb) + '</p></a>';
      }).join("") + '</div>' +
      '<p class="note" style="margin-top:12px">Pick any function from the sidebar for its history, a 3D surface, and a replay of the three versions searching it.</p>' +
      '<h2>Get the code</h2><div class="card"><p style="margin-bottom:10px">The three versions, the benchmarks and the saved results are in the GitHub repository. Encore is on <code>master</code>; Echo is commit <code>b33e76f</code> and Mating Call commit <code>b703cac</code>. It needs Python 3 and NumPy.</p>' +
      '<p style="margin:0"><a class="btn primary" style="display:inline-block;text-decoration:none" href="https://github.com/ktarila/sound_heuristics" target="_blank" rel="noopener">Open the repository ↗</a> &nbsp; ' +
      '<a href="https://github.com/ktarila/sound_heuristics/archive/refs/heads/master.zip">Download Encore as a ZIP</a></p></div>' +
      '<h2>How it works, in one minute</h2>' +
      '<ol>' +
      '<li><b>Loudness.</b> Agents are ranked; the best is loudest and the worst silent.</li>' +
      '<li><b>Hearing.</b> Sound weakens with the square of the distance, so early on an agent mostly hears its neighbours. A rising exponent makes loudness count more later, so the best agents are heard from far away.</li>' +
      '<li><b>Moving.</b> An agent turns to the loudest source it hears: towards it if it is better, away if not, plus a random push from the gaps between agents and places agents left earlier.</li>' +
      '<li><b>Keeping.</b> Only some coordinates move, and a move is kept only if it improves the agent. Step sizes are learned from what worked.</li>' +
      '<li><b>Finishing.</b> The last share of the evaluations goes to the best agent alone, refining its point.</li></ol>' +
      '<p><a href="#/versions">What each of the three versions does →</a></p>';
  }
  function suiteView(suite) {
    var S = T.suites[suite];
    return '<span class="label">' + S.short + '</span><h1>' + S.title + '</h1>' +
      '<p class="lede" style="max-width:75ch">' + esc(S.intro) + '</p>' +
      '<h2>Results</h2><p class="note">Mean error over 30 runs (Echo on CEC 2017: 10 runs), from the saved benchmark files in <code>results/</code>. ' +
      'The "Encore vs Echo" column says whether Encore is significantly better or worse than Echo on that function (Wilcoxon rank-sum test, 5% level). Click a row to open the function.</p>' +
      resultsTable(suite);
  }

  // ---------- versions ----------
  function phaseBar(v) {
    return '<div class="bar">' + v.phases.map(function (p, i) {
      return '<span style="flex:' + p[1] + ';background:var(' + v.color + ');opacity:' + (i === 0 ? 1 : 0.62) + '" title="' + esc(p[0]) + ' · ' + p[1] + '%">' +
        (p[1] < 20 ? p[1] + '%' : esc(p[0]) + ' · ' + p[1] + '%') + '</span>';
    }).join("") + '</div>';
  }
  function hereTwo(v, suite) { return typeof v.here.two === "string" ? v.here.two : v.here.two[suite]; }
  function versionCard(v) {
    var real = SUITES.map(function (s) { return '<li><b>' + T.suites[s].label + ":</b> " + esc(v.here.real[s]) + '</li>'; }).join("");
    return '<section class="card" id="v' + v.id + '" style="margin-bottom:16px">' +
      '<h2 style="margin-top:0;display:flex;align-items:center;gap:10px"><i class="dot" style="background:var(' + v.color + ')"></i>' + v.name + '</h2>' +

      });
    });
    Plotly.react("conv10", traces, chartLayout("evaluations (log scale)", "log"), {displayModeBar: false, responsive: true});
    var parts = VERS.map(function (v) {
      return '<b style="color:var(' + v.color + ')">' + v.name + '</b>: ' + d.ten_runs[String(v.id)].map(function (r) { return fmt(r.final); }).join(", ");
    });
    var t = TABLE[state.suite][state.f];
    $("tensummary").innerHTML = "Error after " + fmtN(d.ten_evals) + " evaluations, " + d.ten_runs["1"].length + " runs each. " + parts.join(" &nbsp;·&nbsp; ") +
      ".<br><span class=\"muted\">30-run average in the benchmark: Echo " + fmt(t.v2) + ", Encore " + fmt(t.v3) + ".</span>";
  }

  // ---------- start ----------
  $("menu").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open"); $("menu").setAttribute("aria-expanded", open ? "true" : "false");
  });
  $("scrim").addEventListener("click", function () { document.body.classList.remove("nav-open"); $("menu").setAttribute("aria-expanded", "false"); });
  var dark = window.matchMedia("(prefers-color-scheme: dark)");
  if (dark.addEventListener) dark.addEventListener("change", function () { if (parseRoute().view === "f" && window.Plotly && state.data) { buildPanels(); drawConv2(); drawConv10(); updateFrame(); } });
  window.addEventListener("hashchange", route);
  buildNav(); route();
})();
</script>
</body>
